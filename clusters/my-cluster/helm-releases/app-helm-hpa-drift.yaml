apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-hpa-drift
  namespace: default
spec:
  interval: 1m
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/metrics/0/resource/target/averageUtilization"]
        target:
          kind: HorizontalPodAutoscaler
  chart:
    spec:
      chart: podinfo
      version: "6.4.0"
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system
  values:
    hpa:
      enabled: true
      maxReplicas: 4
      cpu: 50
