apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: podinfo-keda
  namespace: default
spec:
  scaleTargetRef:
    name: podinfo-keda
    kind: Deployment
    apiVersion: apps/v1
  minReplicaCount: 2
  maxReplicaCount: 4
  triggers:
  - type: cron
    metadata:
      timezone: UTC
      start: 0 0 * * *
      end: 1 0 * * *
      desiredReplicas: "3"

